#cloud-config
# mneme-brain cloud-init v2 (v1.42.3 / Cloud Phase 4 MVP).
#
# v1 hung on `package_upgrade: true` + NodeSource curl-to-bash on a
# fresh droplet (8+ min, ports never opened). v2 keeps it tiny:
#   - no apt update / no apt upgrade (saves 5+ min on cold boot)
#   - Node via snap (pre-installed on Ubuntu 24.04 cloud images)
#   - mneme-brain bound to :8080 (no Caddy / no TLS in v1.42.3 MVP)
#   - server.mjs fetched via raw.githubusercontent.com (no git clone)
#   - everything in runcmd, no write_files of large content
# TLS / Caddy / Let's Encrypt arrives in v1.43 once a domain is live.

users:
  - default
  - name: mneme
    system: true
    no_create_home: false
    shell: /usr/sbin/nologin

write_files:
  - path: /etc/systemd/system/mneme-brain.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Mneme Brain (Cloud Phase 4 MVP, v1.42.3)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=mneme
      Group=mneme
      WorkingDirectory=/opt/mneme-brain
      Environment=PORT=8080
      Environment=HOST=0.0.0.0
      ExecStart=/snap/bin/node /opt/mneme-brain/server.mjs
      Restart=always
      RestartSec=3
      StandardOutput=journal
      StandardError=journal
      LimitNOFILE=65536
      AmbientCapabilities=
      NoNewPrivileges=yes

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Verbose log everything to /var/log/mneme-brain-bootstrap.log so SSH
  # debugging is one `cat` away.
  - bash -xeuo pipefail -c '
      exec > >(tee -a /var/log/mneme-brain-bootstrap.log) 2>&1;
      echo "==> v2 bootstrap start $(date -u +%FT%TZ)";
      snap install node --classic --channel=22;
      node --version;
      mkdir -p /opt/mneme-brain;
      curl -fsSL --retry 3 --retry-delay 2 \
        https://raw.githubusercontent.com/patsa2561-art/mneme-ai/main/cloud/mneme-brain/server.mjs \
        -o /opt/mneme-brain/server.mjs;
      ls -la /opt/mneme-brain/;
      chown -R mneme:mneme /opt/mneme-brain;
      ufw allow OpenSSH;
      ufw allow 8080/tcp;
      yes | ufw enable || true;
      systemctl daemon-reload;
      systemctl enable mneme-brain;
      systemctl restart mneme-brain;
      sleep 3;
      systemctl status mneme-brain --no-pager;
      echo "==> smoke test";
      curl -sf http://127.0.0.1:8080/v1/healthz || echo "health check failed";
      echo "==> v2 bootstrap end $(date -u +%FT%TZ)";
    '

final_message: |
  Mneme Brain (Cloud Phase 4 MVP, v1.42.3) bootstrap finished.
  Test:   curl http://${PUBLIC_IPV4}:8080/v1/healthz
  Logs:   tail -f /var/log/mneme-brain-bootstrap.log
  systemd: journalctl -u mneme-brain -f
