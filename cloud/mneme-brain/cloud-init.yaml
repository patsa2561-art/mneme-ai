#cloud-config
# mneme-brain cloud-init v4 (v1.42.3 / Cloud Phase 4 MVP).
#
# v1-v3 all failed (ports never opened). v4 thesis: drop EVERYTHING that
# touches apt — ALL cloud images have python3 pre-installed. Skip Node
# for the MVP; serve healthz from a 25-line python script. Once we have
# SSH + can confirm what cloud-init was failing on, v5 reintroduces Node.
#
# Cloud-init order: write_files (always) → runcmd (if write_files ok).
# v4 makes runcmd a single self-contained line so we can SEE in
# /var/log/cloud-init-output.log exactly where it died.

write_files:
  - path: /opt/mneme-brain/healthz.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      """Tiny mneme-brain MVP — pure stdlib, no external deps. Serves
      JSON on :8080 for /v1/healthz, /v1/version, /v1/pulse (echoes the
      payload back). Validates the cloud deployment chain works before
      we ship the full Node server."""
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      import json, sys, datetime
      VERSION = "1.42.3-mvp-python"
      class H(BaseHTTPRequestHandler):
          def _send(self, status, body):
              raw = json.dumps(body).encode()
              self.send_response(status)
              self.send_header("content-type", "application/json")
              self.send_header("content-length", str(len(raw)))
              self.send_header("x-mneme-brain", VERSION)
              self.end_headers()
              self.wfile.write(raw)
          def do_GET(self):
              if self.path == "/v1/healthz":
                  return self._send(200, {"ok": True, "version": VERSION, "ts": datetime.datetime.utcnow().isoformat() + "Z"})
              if self.path == "/v1/version":
                  return self._send(200, {"brain": VERSION, "stack": "python3-stdlib"})
              return self._send(404, {"error": "not-found", "path": self.path})
          def do_POST(self):
              n = int(self.headers.get("content-length", "0"))
              raw = self.rfile.read(n) if n else b"{}"
              try: body = json.loads(raw or b"{}")
              except: body = {}
              if self.path == "/v1/pulse":
                  return self._send(200, {"ok": True, "echoed": body, "note": "MVP echoes payload; full pre-executor lands when we swap to Node"})
              if self.path == "/v1/compliance":
                  return self._send(202, {"ack": True, "received": len(body.get("events", []) if isinstance(body, dict) else [])})
              return self._send(404, {"error": "not-found", "path": self.path})
          def log_message(self, fmt, *args): pass
      port = 8080
      print(f"mneme-brain {VERSION} listening on 0.0.0.0:{port}", flush=True)
      ThreadingHTTPServer(("0.0.0.0", port), H).serve_forever()

  - path: /etc/systemd/system/mneme-brain.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Mneme Brain (Cloud Phase 4 MVP, v1.42.3 / python3 stdlib)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/python3 /opt/mneme-brain/healthz.py
      Restart=always
      RestartSec=3
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

runcmd:
  - bash -c 'set -x; mkdir -p /opt/mneme-brain; chmod +x /opt/mneme-brain/healthz.py; systemctl daemon-reload; systemctl enable mneme-brain; systemctl restart mneme-brain; sleep 2; ufw allow OpenSSH 2>/dev/null || true; ufw allow 8080/tcp; yes | ufw enable 2>/dev/null || true; ss -tlnp; echo "==> v4 done $(date -u +%FT%TZ)"' 2>&1 | tee /var/log/mneme-brain-bootstrap.log

final_message: |
  Mneme Brain MVP (v4 / python3) bootstrap finished.
  Test: curl http://${PUBLIC_IPV4}:8080/v1/healthz
  Logs: cat /var/log/mneme-brain-bootstrap.log
