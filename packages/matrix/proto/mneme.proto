// THE MATRIX RAIL — Mneme's local-first gRPC contract.
// One typed door (Invoke) to every Mneme function + one chunked bidi pipe (Pipe)
// so ANY-size payload flows byte-identical, past gRPC's 4MB message cap.
syntax = "proto3";
package mneme;

service Matrix {
  // Generic gateway — maps 1:1 to the tool registry. Every current AND future
  // tool is reachable here with no schema change. Response carries a TRUSTLESS proof.
  rpc Invoke (ToolRequest) returns (ToolResponse);

  // The chunked bidi pipe: a client streams the request as ordered, manifested
  // frames; the server reassembles (full integrity check), processes, and streams
  // the response back as frames. Each frame is small (<256KB) so the 4MB cap is
  // never hit, regardless of total payload size.
  rpc Pipe (stream Frame) returns (stream Frame);

  // CONTEXT STREAM (Phase 2) — the delta channel. The client opens with a
  // snapshot, then streams tiny splice ops; the server holds the doc and returns
  // a COMPACT ack per op (hash + sizes, never the whole doc). "Send the delta,
  // not the packet" — byte-exact, with a measured byte saving over re-sending.
  rpc ContextStream (stream DeltaMsg) returns (stream DeltaAck);

  // SELF-DESCRIBING DISCOVERY — an AI agent that connects over gRPC (any language,
  // any process) lists the ENTIRE tool surface + each tool's JSON Schema here, so it
  // can use every function WITHOUT knowing names in advance. The gRPC peer of MCP's
  // tools/list. Optional `query` filters by name/category/description.
  rpc ListTools (ListToolsRequest) returns (ListToolsReply);

  // THE WISDOM SEARCH — intent → the right tool(s). An agent that knows what the
  // user WANTS (plain language) but not the tool name searches here. BM25 retrieval
  // boosted by each tool's curated `triggers` (when-to-use wisdom) + proven usage.
  // Deterministic, no LLM. The autonomous-discovery core.
  rpc Search (SearchRequest) returns (SearchReply);

  rpc Health (HealthRequest) returns (HealthReply);
}

message ListToolsRequest { string query = 1; uint32 limit = 2; }
message ToolInfo { string name = 1; string category = 2; string description = 3; string input_schema_json = 4; }
message ListToolsReply { repeated ToolInfo tools = 1; uint32 total = 2; uint32 returned = 3; }

message SearchRequest { string intent = 1; uint32 limit = 2; }
message ToolHit { string name = 1; string category = 2; string description = 3; double score = 4; string why = 5; }
message SearchReply { repeated ToolHit hits = 1; uint32 considered = 2; }

message DeltaMsg {
  string channel_id = 1;  // logical channel (lets one connection multiplex docs)
  bool snapshot = 2;      // true for the opening frame (sets `base`)
  string base = 3;        // the initial document (only read when snapshot=true)
  string op_json = 4;     // a SpliceOp { at, del, ins } as JSON (when snapshot=false)
}
message DeltaAck {
  bool ok = 1;
  string doc_hash = 2;    // sha256 of the server's current doc — byte-exact proof
  uint32 doc_len = 3;
  uint32 delta_bytes = 4; // bytes this op cost on the wire
  string error = 5;
}

message ToolRequest  { string tool = 1; string args_json = 2; string held_root = 3; }
message ToolResponse { bool ok = 1; string data_json = 2; string wisdom = 3; string proof_json = 4; string error = 5; }

// One frame of the Matrix pipe (mirrors @mneme-ai/core matrix.Frame).
message Frame {
  string id = 1;          // sha256 of the whole ORIGINAL payload (== integrity manifest)
  uint32 seq = 2;         // 0-based order
  uint32 total = 3;       // total frame count
  uint32 orig_bytes = 4;  // original (decompressed) length
  bool gz = 5;            // data is gzip-compressed
  bytes data = 6;         // the (possibly compressed) slice
}

message HealthRequest {}
message HealthReply { bool ok = 1; string version = 2; uint32 tools = 3; string note = 4; bool trustless = 5; }
