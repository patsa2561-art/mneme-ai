<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>/* apply saved text size before paint (no flash); persists across browser restarts */
(function(){try{var s=localStorage.getItem("xray-fs")||"s";document.documentElement.className=(document.documentElement.className+" fs-"+s).trim();}catch(e){}})();</script>
<title>Mneme · Repo X-Ray</title>
<link rel="icon" href="/favicon.svg" />
<!--OGMETA-->
<style>
  :root{--ink:#0b0b0f;--ink2:#33333b;--sub:#8b8f98;--line:#ececef;--line2:#f3f3f5;--soft:#fafafb;

  .g-C{background:linear-gradient(135deg,#eaa83a,#c9821a)}.g-D{background:linear-gradient(135deg,#f0742e,#d4571a)}.g-F{background:linear-gradient(135deg,#f43f5e,#be123c)}

  .hgauge{display:inline-flex;align-items:center;gap:8px;font-weight:680;color:#15803d;font-size:14px}

  .verifybtn{font-size:11.5px;border:1px solid #86c79b;background:#fff;color:#15803d;border-radius:8px;padding:2px 9px;cursor:pointer;font-weight:560}.verifybtn:hover{background:#f0fdf4}
  .membrane{display:flex;border-bottom:1px solid #eef0f2;background:#fafbfc}
  .mp{flex:1;padding:11px 18px;border-right:1px solid #eef0f2;display:flex;flex-direction:column;gap:3px}.mp:last-child{border-right:0}
  .mpk{font-size:10.5px;letter-spacing:.06em;color:#8a909a;font-weight:700}
  .mpv{font-size:12.5px;color:#2b2f36;font-weight:560;display:flex;align-items:center;gap:7px}
  .triage{padding:14px 30px 4px}
  .triage-h{font-size:13px;font-weight:680;color:#b45309;margin-bottom:9px}.triage-sub{font-weight:400;color:#9aa0a6;font-size:11.5px}
  .triage.clearall{padding:13px 30px;color:#15803d;font-weight:560;font-size:13px;background:#f0fdf4;border-bottom:1px solid #dcfce7}
  .ti{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-top:1px solid #f1f2f4}
  .ti-sev{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;min-width:62px;text-align:center}
  .ti.critical .ti-sev{background:#fee2e2;color:#b91c1c}.ti.warn .ti-sev{background:#fef3c7;color:#b45309}.ti.info .ti-sev{background:#e0e7ff;color:#4338ca}
  .ti-body{flex:1;min-width:0}.ti-f{font-size:13px;color:#1f2329}.ti-p{font-size:11px;color:#9aa0a6;margin-top:2px;font-family:ui-monospace,Menlo,monospace}
  .rows{padding:6px 30px 16px}
  .row{display:flex;gap:18px;padding:17px 0;border-bottom:1px solid var(--line2);align-items:baseline}.row:last-child{border-bottom:0}
  .row .k{width:138px;flex:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);font-weight:700}
  .kdesc{font-size:11.5px;color:#5e636d;text-transform:none;letter-spacing:0;font-weight:400;line-height:1.4}

</head>
<body>
<div class="fontpick" role="group" aria-label="Text size">
  <button type="button" data-fs="s" title="Small text">A</button>
  <button type="button" data-fs="m" title="Medium text">A</button>
  <button type="button" data-fs="l" title="Large text">A</button>
</div>
<script>/* text-size selector — sets <html> class + remembers the choice */
(function(){function apply(s){document.documentElement.className=document.documentElement.className.replace(/\bfs-[sml]\b/g,"").trim()+" fs-"+s;document.querySelectorAll(".fontpick button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-fs")===s));});}
var cur=(localStorage.getItem("xray-fs")||"s");apply(cur);
document.querySelectorAll(".fontpick button").forEach(function(b){b.addEventListener("click",function(){var s=b.getAttribute("data-fs");try{localStorage.setItem("xray-fs",s);}catch(e){}apply(s);});});})();</script>
<div class="wrap">
  <div class="nav"><span class="mark">Mneme · Repo X-Ray</span><a class="home" href="/">X-ray another repo →</a></div>
  <div id="out"><div class="miss">Loading…</div></div>
  <div class="vbadge" id="vb"></div>
</div>
<script src="/card.js"></script>
<script>
const esc = s => String(s==null?"":s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fp = decodeURIComponent(location.pathname.replace(/^\/r\//,"").replace(/\/$/,""));
function mountShare(r){
  const el=document.getElementById("share"); if(!el) return;
  const link=`${location.origin}/r/${r.fingerprint}`;
  let t=r.fingerprint;
  if(r.subject.kind==="git-url"){const m=String(r.subject.ref).replace(/\.git$/,"").match(/(github|gitlab|bitbucket)\.[a-z]+\/([^/]+\/[^/]+)/);if(m)t=`${m[1]}/${m[2]}`;}
  const badge=`${location.origin}/badge/${t}.svg`, md=`[![Mneme X-Ray](${badge})](${link})`;
  el.innerHTML=`<img class="badgeimg" src="${badge}"/><button class="sbtn" data-c="${esc(md)}">Copy badge markdown</button><button class="sbtn ghost" data-c="${esc(link)}">Copy permalink</button>`;
  el.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(b.dataset.c);const x=b.textContent;b.textContent="Copied ✓";setTimeout(()=>b.textContent=x,1200);}catch{}}));
}
(async()=>{
  try{
    const res=await fetch("/api/report/"+encodeURIComponent(fp));
    if(!res.ok){document.getElementById("out").innerHTML='<div class="miss">Report not found. <a href="/">X-ray a repo →</a></div>';return;}
    const signed=await res.json();
    document.getElementById("out").innerHTML=window.MnemeXRay.xrayCardHTML(signed,{share:true});
    mountShare(signed.report);
    // verify the signature live, in the visitor's browser
    try{
      const v=await (await fetch("/api/verify",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(signed)})).json();
      document.getElementById("vb").textContent = v.valid ? "✓ signature verified" : "✗ signature invalid: "+v.reason;
    }catch{}
  }catch(e){document.getElementById("out").innerHTML='<div class="miss">Error loading report.</div>';}
})();
</script>
</body>
</html>
