# Mneme — Bitbucket Pipelines template
#
# Add to bitbucket-pipelines.yml at the root of your repo. Runs Mneme's
# audit on every PR + main-branch push.
#
# Required repository variables (Repository settings → Pipelines → Variables):
#   • MNEME_HMAC_SECRET (optional) — for tamper-evident ledger signatures
#   • BITBUCKET_TOKEN (App password with PR-write scope) — for PR comments
#
# Bitbucket gives you 50 free build minutes/month on the small plan; this
# template uses ~1 minute per run.

image: node:22

definitions:
  steps:
    - step: &mneme-audit
        name: Mneme — AI session audit
        caches:
          - node
        script:
          # Full history (Bitbucket clone-depth defaults to 50)
          - git fetch --unshallow || true
          # Install + index
          - npm install -g mneme-ai
          - mneme init
          - mneme index --cap 5000
          # Baseline snapshot (PR only)
          - |
            if [ -n "$BITBUCKET_PR_DESTINATION_BRANCH" ]; then
              git checkout origin/$BITBUCKET_PR_DESTINATION_BRANCH
              mneme audit --baseline
              git checkout $BITBUCKET_COMMIT
            fi
          # Audit certify + forensics + deps
          - mneme audit --certify --explain --json > audit-result.json || true
          - mneme forensics vulns --top 20 --json > vulns.json || true
          - mneme deps audit --json > deps.json || true
          # Parse verdict
          - export VERDICT=$(node -p "JSON.parse(require('fs').readFileSync('audit-result.json','utf8')).verdict || 'UNKNOWN'")
          - echo "Mneme verdict — $VERDICT"
          # PR comment via Bitbucket API
          - |
            if [ -n "$BITBUCKET_PR_ID" ] && [ -n "$BITBUCKET_TOKEN" ]; then
              SUMMARY=$(node -p "JSON.parse(require('fs').readFileSync('audit-result.json','utf8')).summary || ''")
              VULN_COUNT=$(node -p "(JSON.parse(require('fs').readFileSync('vulns.json','utf8')).findings || []).length")
              EMOJI=$([ "$VERDICT" = "PASS" ] && echo "✅" || ([ "$VERDICT" = "WARN" ] && echo "⚠️" || echo "❌"))
              BODY="$EMOJI Mneme audit · $VERDICT\n\n$SUMMARY\n\nForensics: $VULN_COUNT vuln finding(s)\n\nGenerated by Mneme · the Stage-3 tune for AI coding tools"
              curl -s -u "x-token-auth:$BITBUCKET_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST \
                -d "{\"content\":{\"raw\":\"$BODY\"}}" \
                "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/pullrequests/$BITBUCKET_PR_ID/comments"
            fi
          # Fail if FAIL
          - |
            if [ "$VERDICT" = "FAIL" ]; then
              echo "Mneme audit FAILED. Investigate before merging." >&2
              exit 1
            fi
        artifacts:
          - audit-result.json
          - vulns.json
          - deps.json

pipelines:
  pull-requests:
    '**':
      - step: *mneme-audit
  branches:
    main:
      - step: *mneme-audit
