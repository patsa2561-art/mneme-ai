# Mneme — GitLab CI template
#
# Drop this into .gitlab-ci.yml or include it from your existing pipeline:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/patsa2561-art/mneme-ai/main/docs/ci-templates/gitlab-ci.yml'
#
# Runs Mneme's audit on every MR + main-branch push.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   • MNEME_HMAC_SECRET (optional) — for tamper-evident ledger signatures
#   • GITLAB_TOKEN (auto-injected) — for posting MR comments

stages:
  - mneme-audit

mneme-audit:
  stage: mneme-audit
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"   # full history — Mneme needs it
  before_script:
    - npm install -g mneme-ai
    - mneme init
    - mneme index --cap 5000
  script:
    # Baseline snapshot (MR only — diff against target branch)
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git checkout $CI_MERGE_REQUEST_TARGET_BRANCH_SHA
        mneme audit --baseline
        git checkout $CI_COMMIT_SHA
      fi
    # 5-axis audit certify
    - mneme audit --certify --explain --json > audit-result.json || true
    - VERDICT=$(node -p "JSON.parse(require('fs').readFileSync('audit-result.json','utf8')).verdict || 'UNKNOWN'")
    - echo "MNEME_VERDICT=$VERDICT" > mneme.env
    # Forensics + deps audit
    - mneme forensics vulns --top 20 --json > vulns.json || true
    - mneme deps audit --json > deps.json || true
    # Post MR comment via GitLab API
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && [ -n "$GITLAB_TOKEN" ]; then
        SUMMARY=$(node -p "JSON.parse(require('fs').readFileSync('audit-result.json','utf8')).summary || ''")
        VULN_COUNT=$(node -p "(JSON.parse(require('fs').readFileSync('vulns.json','utf8')).findings || []).length")
        EMOJI=$([ "$VERDICT" = "PASS" ] && echo "✅" || ([ "$VERDICT" = "WARN" ] && echo "⚠️" || echo "❌"))
        BODY="## $EMOJI Mneme audit · **$VERDICT**\n\n$SUMMARY\n\n**Forensics:** $VULN_COUNT vuln finding(s)\n\n<sub>Generated by Mneme · the Stage-3 tune for AI coding tools</sub>"
        curl -s --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          --data-urlencode "body=$BODY" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
      fi
    # Fail the job if audit FAILED
    - |
      if [ "$VERDICT" = "FAIL" ]; then
        echo "Mneme audit FAILED. Investigate before merging." >&2
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - audit-result.json
      - vulns.json
      - deps.json
    reports:
      dotenv: mneme.env
    expire_in: 30 days
