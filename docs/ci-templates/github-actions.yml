# Mneme — GitHub Actions template
#
# Drop this into .github/workflows/mneme.yml in your repo. It runs Mneme's
# AI session audit on every PR and posts the verdict as a check + comment.
#
# Triggers:
#   • on every PR to main → audit + comment
#   • on every push to main → trace + ledger entry (forensic-grade)
#
# Required secrets (Settings → Secrets and variables → Actions):
#   • GITHUB_TOKEN — built-in, no setup
#   • MNEME_HMAC_SECRET (optional) — for tamper-evident ledger signatures
#
# Cost: ~30 seconds per PR on a typical repo. Zero external API calls
# (Mneme indexes locally on the runner with the bundled WASM embedder).

name: Mneme — AI Session Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # so we can comment the verdict on the PR
  checks: write          # so we can post a check status

jobs:
  audit:
    name: mneme audit · 5-axis trust certificate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — Mneme needs it

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Mneme
        run: npm install -g mneme-ai

      - name: Initialize + index repo
        run: |
          mneme init
          mneme index --cap 5000

      - name: Snapshot baseline (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          mneme audit --baseline
          git checkout ${{ github.sha }}

      - name: Audit certify
        id: certify
        env:
          MNEME_HMAC_SECRET: ${{ secrets.MNEME_HMAC_SECRET }}
        run: |
          mneme audit --certify --explain --json > audit-result.json || true
          VERDICT=$(node -p "JSON.parse(require('fs').readFileSync('audit-result.json','utf8')).verdict || 'UNKNOWN'")
          echo "verdict=$VERDICT" >> $GITHUB_OUTPUT

      - name: Forensics quick scan
        run: mneme forensics vulns --top 20 --json > vulns.json || true

      - name: Dependency advisory cross-check
        run: mneme deps audit --json > deps.json || true

      - name: Comment verdict on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit-result.json','utf8'));
            const vulns = JSON.parse(fs.readFileSync('vulns.json','utf8'));
            const verdict = audit.verdict || 'UNKNOWN';
            const emoji = verdict === 'PASS' ? '✅' : verdict === 'WARN' ? '⚠️' : '❌';
            const body = [
              `## ${emoji} Mneme audit · **${verdict}**`,
              ``,
              audit.summary || '',
              ``,
              `**Forensics:** ${(vulns.findings || []).length} vuln finding(s)`,
              `**5-axis scores:** ${JSON.stringify(audit.axes || {}, null, 2)}`,
              ``,
              `<sub>Generated by Mneme · the Stage-3 tune for AI coding tools</sub>`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail the check if audit FAILED (and not labeled override)
        if: steps.certify.outputs.verdict == 'FAIL'
        run: |
          echo "Mneme audit FAILED. Add the 'mneme-override' label to bypass." >&2
          exit 1
