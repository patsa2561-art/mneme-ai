name: Sync Wiki

# Auto-publish the docs/wiki/ markdown files to the project's GitHub wiki
# on every push to main that touches them. The wiki repo is a separate
# git repository at <repo>.wiki.git — we clone it, mirror docs/wiki/
# verbatim (filename = page name; _Sidebar.md / _Footer.md special), and
# push.
#
# Authentication notes:
#   - GitHub's default `GITHUB_TOKEN` cannot push to the wiki repo
#     reliably. Wiki repos sit in a separate permission scope; even with
#     `permissions: contents: write` declared here, GitHub's token policy
#     blocks pushes to *.wiki.git from `github-actions[bot]`.
#   - The reliable fix: create a fine-grained personal access token
#     (or classic PAT with `repo` scope), save it as the repo secret
#     `WIKI_PUSH_TOKEN`, and the workflow uses it for the push.
#   - If `WIKI_PUSH_TOKEN` is not set, the workflow falls back to
#     `GITHUB_TOKEN` (works on some accounts; fails 403 on most).
#
# How to create the PAT:
#   1. Open https://github.com/settings/personal-access-tokens/new
#      (or https://github.com/settings/tokens/new for classic).
#   2. Fine-grained: Repository = patsa2561-art/mneme-ai · Permissions:
#      "Contents: Read and write" (Wiki sub-scope inherited).
#      Classic: scope `repo` (full).
#   3. Copy the token, then add it as a repo secret named
#      `WIKI_PUSH_TOKEN` at:
#      https://github.com/patsa2561-art/mneme-ai/settings/secrets/actions

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Sync docs/wiki to GitHub wiki
        env:
          # WIKI_PUSH_TOKEN is preferred; falls back to GITHUB_TOKEN.
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"

          # PAT auth uses owner:token; GITHUB_TOKEN uses x-access-token.
          # Detect by length: PATs are 40+ chars classic / 93 chars
          # fine-grained; GITHUB_TOKEN is ~76 chars and starts with ghs_.
          if [[ "${WIKI_TOKEN}" == ghp_* || "${WIKI_TOKEN}" == github_pat_* ]]; then
            wiki_url="https://${GITHUB_ACTOR}:${WIKI_TOKEN}@github.com/${repo}.wiki.git"
            echo "Using personal access token for wiki push."
          else
            wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${repo}.wiki.git"
            echo "::warning::Using GITHUB_TOKEN for wiki push — may 403 on wiki repos. If this run fails, set WIKI_PUSH_TOKEN repo secret per the workflow header docs."
          fi

          tmp_dir="$(mktemp -d)"
          echo "Cloning wiki into $tmp_dir"

          # Try cloning. If the wiki has never been initialized, this fails;
          # we initialize it ourselves with an initial Home.md.
          if ! git clone --depth 1 "$wiki_url" "$tmp_dir" 2>/dev/null; then
            echo "::warning::Wiki repo not yet initialized. Bootstrapping it."
            mkdir -p "$tmp_dir"
            cd "$tmp_dir"
            git init -b master
            echo "# ${repo##*/}" > Home.md
            git add Home.md
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "init wiki"
            git remote add origin "$wiki_url"
            git push -u origin master
            cd -
          fi

          # Mirror docs/wiki -> wiki repo (excluding non-wiki files)
          rsync -a --delete \
            --exclude=".git" \
            --include="*.md" \
            --include="_Sidebar.md" \
            --include="_Footer.md" \
            --exclude="*" \
            "docs/wiki/" "$tmp_dir/"

          cd "$tmp_dir"

          # Diff check — bail early if no change
          if git diff --quiet && git diff --cached --quiet; then
            echo "No wiki changes to publish."
            exit 0
          fi

          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "sync from main: ${GITHUB_SHA::7}"
          git push origin HEAD

          echo "::notice::Wiki synced from docs/wiki/ at ${GITHUB_SHA::7}"
