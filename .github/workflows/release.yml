name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test, and publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Configure git
        run: |
          git config --global user.email "ci@mneme.dev"
          git config --global user.name "Mneme CI"
          git config --global core.autocrlf false
          git config --global init.defaultBranch main

      - name: Install
        run: npm ci

      - name: Build (sanity gate — type errors block publish)
        run: npm run build

      # Belt-and-braces: ci.yml validates on every push, but having the test +
      # eval gates here too is correct production hygiene for a tag-triggered
      # publish. Cross-platform snapshot stability fixes in helpers.ts make
      # the regression suite reliable on the Linux runner.
      - name: Test (full suite)
        run: npm test

      - name: Eval (baseline variant)
        run: npm run eval -- --variant baseline --quiet

      - name: Generate SBOM (CycloneDX)
        run: npm run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.json
          retention-days: 365

      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty. Set it in repo Settings → Secrets → Actions."
            exit 1
          fi
          npm whoami || { echo "::error::npm whoami failed — token may be invalid or expired."; exit 1; }

      - name: Publish core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish embeddings
        working-directory: packages/embeddings
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish correlator
        working-directory: packages/correlator
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish mcp
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish cli
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
