name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test, and publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Configure git
        run: |
          git config --global user.email "ci@mneme.dev"
          git config --global user.name "Mneme CI"
          git config --global core.autocrlf false
          git config --global init.defaultBranch main

      - name: Install (self-heal + ignore-scripts)
        shell: bash
        # --ignore-scripts: onnxruntime-node@1.22.0 has a packaging bug
        # (install script requires adm-zip without declaring it). Tests
        # don't need the native ONNX binary; embeddings are mocked.
        run: npm ci --ignore-scripts || (echo "::warning::lockfile integrity drift -- self-healing"; node scripts/heal-lockfile.mjs && npm ci --ignore-scripts)

      - name: Build (sanity gate — type errors block publish)
        run: npm run build

      # Belt-and-braces: ci.yml validates on every push, but having the test +
      # eval gates here too is correct production hygiene for a tag-triggered
      # publish. Cross-platform snapshot stability fixes in helpers.ts make
      # the regression suite reliable on the Linux runner.
      - name: Test (full suite)
        run: npm test

      - name: Eval (baseline variant)
        run: npm run eval -- --variant baseline --quiet

      - name: Generate SBOM (CycloneDX)
        run: npm run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.json
          retention-days: 365

      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty. Set it in repo Settings → Secrets → Actions."
            exit 1
          fi
          npm whoami || { echo "::error::npm whoami failed — token may be invalid or expired."; exit 1; }

      # Each publish step is idempotent: if the version is already on npm
      # (e.g. tag re-pushed, manual pre-publish, retry after a partial
      # failure), the step skips with a notice instead of failing. This
      # avoids the 403 "cannot publish over previously published versions"
      # error from a duplicate tag-triggered run.

      - name: Publish core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VER already on npm — skipping publish"
          else
            npm publish --access public
          fi

      - name: Publish embeddings
        working-directory: packages/embeddings
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VER already on npm — skipping publish"
          else
            npm publish --access public
          fi

      - name: Publish correlator
        working-directory: packages/correlator
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VER already on npm — skipping publish"
          else
            npm publish --access public
          fi

      - name: Publish mcp
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VER already on npm — skipping publish"
          else
            npm publish --access public
          fi

      - name: Publish cli
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VER already on npm — skipping publish"
          else
            npm publish --access public
          fi
