name: Windows install smoke

# v2.19.55 — catches Windows-specific install bugs (EBUSY, libvips lock,
# preinstall hook failures) BEFORE user hits them. Spins up a fresh
# windows-latest runner, builds + packs the tarball, installs globally,
# verifies `mneme --version` + `mneme welcome --json '{}'` work.
#
# Runs on every push to main + every PR + every release tag. Sister
# workflow to scripts/reincarnation-ritual.mjs (which runs on the
# author's machine pre-publish). This is the cross-platform companion.

# v2.132.0 — RUNNER-LOAD REDUCTION: Windows runners are the scarcest + cost 2×
# minutes. Run this release smoke-test on RELEASE tags + on demand only — not on
# every main push and every PR, which were saturating the free concurrent-job
# budget and leaving the important Pages deploy stuck `queued` (then cancelled by
# the next push → the recurring red X). Release-time coverage is what matters here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows-install-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Pack all 5 tarballs
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/mneme-tarballs
          for pkg in core embeddings correlator mcp cli; do
            cd packages/$pkg
            npm pack --pack-destination /tmp/mneme-tarballs
            cd ../..
          done
          ls -la /tmp/mneme-tarballs

      - name: Install from local tarballs (zero-native default path)
        shell: bash
        run: |
          set -e
          cd /tmp
          mkdir -p mneme-install-test
          cd mneme-install-test
          npm init -y
          # Install all 5 in dependency order: core → embeddings/correlator → mcp → cli
          npm install --no-save /tmp/mneme-tarballs/mneme-ai-core-*.tgz
          npm install --no-save /tmp/mneme-tarballs/mneme-ai-embeddings-*.tgz
          npm install --no-save /tmp/mneme-tarballs/mneme-ai-correlator-*.tgz
          npm install --no-save /tmp/mneme-tarballs/mneme-ai-mcp-*.tgz
          npm install --no-save /tmp/mneme-tarballs/mneme-ai-*.tgz
          ls -la node_modules/mneme-ai
          ls -la node_modules/mneme-ai/bin

      - name: Verify mneme --version runs (zero-native install)
        shell: bash
        run: |
          set -e
          cd /tmp/mneme-install-test
          node node_modules/mneme-ai/bin/mneme.js --version

      - name: Verify mneme welcome --json '{}' runs (smoke the MCP-router CLI)
        shell: bash
        run: |
          set -e
          cd /tmp/mneme-install-test
          node node_modules/mneme-ai/bin/mneme.js welcome --json '{}' || echo "welcome --json '{}' exit code: $?"

      - name: Verify mneme.optional.status runs (zero-native verification)
        shell: bash
        run: |
          set -e
          cd /tmp/mneme-install-test
          # Should report transformers as MISSING (since we did --no-save without optional)
          # but Mneme runtime should still work fine via hash fallback.
          node -e "
            const core = require('@mneme-ai/core');
            core.optionalNative.installStatus().then(s => {
              console.log('available:', s.available.map(p => p.name).join(','));
              console.log('missing:', s.missing.map(p => p.name).join(','));
              if (!s.recommendation) throw new Error('no recommendation');
              console.log('recommendation:', s.recommendation);
            });
          "

      - name: Run ritual phase 3.9 enforcement check
        shell: bash
        run: |
          set -e
          # Verify embeddings has @huggingface/transformers in optionalDependencies
          # (not in dependencies). Phase 3.9 of ritual enforces this on every publish.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/embeddings/package.json', 'utf8'));
            if (pkg.dependencies && pkg.dependencies['@huggingface/transformers']) {
              console.error('FAIL: transformers is in hard dependencies — Windows EBUSY race risk');
              process.exit(1);
            }
            if (!pkg.optionalDependencies || !pkg.optionalDependencies['@huggingface/transformers']) {
              console.error('FAIL: transformers missing from optionalDependencies');
              process.exit(1);
            }
            console.log('phase 3.9: PASS — transformers correctly in optionalDependencies');
          "

      # v2.19.58 → v2.19.61 → v2.19.67 — THE REAL EBUSY RACE TEST (user-observed 7+ rounds).
      # v2.19.65 added CLI Phoenix P3 bootstrap (bin/mneme.js) + ESM __dirname
      # fix in dll_extraction.ts → daemons now load libvips from %TEMP%, not
      # node_modules → the canonical install-time path is never held.
      # v2.19.67 promotes this gate from soft-fail to HARD-FAIL because the
      # killer scenario was reproduced empirically and is now extinct.
      - name: 🪟 EBUSY RACE SMOKE — install-while-daemon-running (HARD-FAIL, v2.19.67)
        shell: bash
        run: |
          set -e
          # Step 1: install a recent prior version with ALL optional deps (so sharp/libvips ARE installed)
          # This is the WORST case for EBUSY — DLLs present and loadable.
          npm install -g mneme-ai@2.19.57
          # Step 2: start the daemon
          mneme daemon start || echo "daemon start (best-effort)"
          sleep 5
          mneme daemon status || true
          # Step 3: WARM the DLL cache by running verify
          # — this loads sharp/libvips into the daemon's address space if installed
          mneme verify "smoke claim" || echo "warm verify (best-effort)"
          sleep 2
          # Step 4: install the JUST-PACKED current version with NO flags.
          # v2.19.65+ Phoenix P3 + the v2.19.61 preinstall taskkill must make
          # this succeed even with the daemon ALIVE and DLLs WARM.  This is the
          # exact scenario user reproduced 8 times in the v40-v64 audit;
          # post-v2.19.65 it MUST pass on every CI run.
          npm install -g --no-save /tmp/mneme-tarballs/mneme-ai-*.tgz
          echo "✅ EBUSY race test PASSED — install completed cleanly with daemon + DLLs warm"
          # Step 5: verify the new binary works
          mneme --version
          # Step 6: verify --format=human flag works (v2.19.61 backward compat)
          mneme verify "format test" --format=human || true
          mneme verify "format test" --format=json || true
          # Step 7 (NEW in v2.19.67): verify CLI Phoenix bootstrap actually fired —
          # if the dist file regressed __dirname back to CJS, this would catch it.
          node -e "
            const r = require('child_process').spawnSync(process.execPath, [
              require.resolve('mneme-ai/bin/mneme.js'), 'phoenix', 'extract_status', '--json', '{}'
            ], { encoding: 'utf8', timeout: 30000 });
            const out = r.stdout || '';
            const ok = /\"dllExtracted\":true/.test(out) || /\"libDir\":null/.test(out);
            if (!ok) {
              console.error('PHOENIX P3 status did not report dllExtracted/libDir; raw output: ' + out.slice(0, 400));
              process.exit(1);
            }
            console.log('✅ Phoenix P3 status verified: ' + (out.match(/\"wisdom\":\"[^\"]+/)?.[0] || 'ok'));
          "
