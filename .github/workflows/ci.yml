name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build · test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@mneme.dev"
          git config --global user.name "Mneme CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (typecheck)
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

      - name: Eval harness (regression gate)
        run: npm run eval -- --variant baseline --quiet

  eval-matrix:
    name: eval · all variants
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Configure git
        run: |
          git config --global user.email "ci@mneme.dev"
          git config --global user.name "Mneme CI"
          git config --global core.autocrlf false
      - run: npm ci
      - run: npm run build
      - name: Run full eval
        run: npm run eval -- --out tests/.tmp/eval-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: tests/.tmp/eval-report.json
          retention-days: 30

  bench:
    name: bench · perf
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Configure git
        run: |
          git config --global user.email "ci@mneme.dev"
          git config --global user.name "Mneme CI"
          git config --global core.autocrlf false
      - run: npm ci
      - run: npm run build
      - name: Run benchmark (small + medium)
        run: npm run bench -- --only small --out tests/.tmp/bench-small.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: tests/.tmp/*.json
          retention-days: 30
