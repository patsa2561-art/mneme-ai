name: Deploy Dashboard to GitHub Pages

on:
  # v1.24.3 — push to main is the ONLY auto-trigger.
  # We REMOVED `tags: ['v*']` (added in v1.24.1) because:
  #   1. The github-pages environment has a deployment-branch
  #      protection rule that only allows `main`, not tags. Tag
  #      pushes failed instantly with "not allowed to deploy".
  #   2. Tag pushes happen RIGHT AFTER the main push during release.
  #      With concurrency: cancel-in-progress, the tag run cancelled
  #      the main run that WOULD have succeeded, leaving zero good
  #      deploys per release.
  # Now every main push redeploys; tags don't trigger anything.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (root, workspaces; --ignore-scripts because the
              web build doesn't need onnxruntime-node's native binary,
              and onnxruntime-node@1.22.0 has a packaging bug where its
              install script requires `adm-zip` without declaring it)
        shell: bash
        # Three-tier, drift-tolerant install. ROOT CAUSE of the chronic
        # red-X Pages deploys: every release bumps package.json versions but
        # the committed package-lock.json lagged a version, so `npm ci`
        # (which hard-fails on ANY package.json↔lock mismatch) failed — and
        # heal-lockfile.mjs only repairs registry INTEGRITY drift, never
        # WORKSPACE-VERSION drift, so the self-heal couldn't recover. Tier 3
        # (`npm install`, which tolerates drift) makes a forgotten lockfile
        # bump degrade to a slower install instead of a failed deploy.
        run: |
          npm ci --ignore-scripts \
            || (echo "::warning::lockfile integrity drift -- self-healing"; node scripts/heal-lockfile.mjs && npm ci --ignore-scripts) \
            || (echo "::warning::lockfile version drift -- falling back to drift-tolerant install"; npm install --ignore-scripts --no-audit --no-fund)

      - name: Build dashboard
        run: npm run build --workspace=@mneme-ai/web
        env:
          BASE_PATH: /mneme-ai/

      # v1.24.1 — emit a deploy-info.json the deployed site exposes so we
      # (and any AI agent) can hit https://patsa2561-art.github.io/mneme-ai/deploy-info.json
      # and SEE exactly which commit + version + timestamp is currently live.
      # Solves the "site looks stale -- did the deploy fire?" debugging gap.
      - name: Emit deploy-info.json
        shell: bash
        run: |
          cat > packages/web/dist/deploy-info.json <<EOF
          {
            "version": "$(node -p "require('./packages/web/package.json').version")",
            "commit": "${{ github.sha }}",
            "shortCommit": "$(echo ${{ github.sha }} | cut -c1-7)",
            "ref": "${{ github.ref }}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "${{ github.workflow }}",
            "runId": "${{ github.run_id }}",
            "runNumber": ${{ github.run_number }}
          }
          EOF
          cat packages/web/dist/deploy-info.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
