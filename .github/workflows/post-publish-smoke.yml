name: Post-publish smoke gate

# v2.19.64 — POST-PUBLISH SMOKE GATE — operational hygiene, NOT a feature.
# Closes two bug classes the user identified:
#
#   - v2.19.58 ETARGET (4/5 packages published, meta-package broken on npm)
#   - v2.19.48 ship-broken preinstall (Cannot find module './bin/preinstall...')
#
# Trigger: every release tag push (`v*`). Wait 60s for npm registry CDN
# replication. Then in a clean Ubuntu runner:
#
#   1. `npm install -g mneme-ai@<tag-version>`
#   2. `mneme --version` must exit 0 + match
#   3. `mneme welcome --json '{}'` must exit 0 + produce valid JSON
#   4. `mneme verify "smoke claim"` must exit 0 + return a verdict
#   5. `mneme.install.trail` (via daemon) must have a complete-install entry
#
# On failure (after 5 install+version retries to rule out CDN lag): emit a
# GitHub issue for HUMAN review. v2.136.0 — this gate is ADVISORY and NO LONGER
# auto-deprecates: a CI smoke can be a false positive, and deprecating a
# published version is a destructive, user-facing decision that belongs to a
# human, never to a flaky job. Deprecate by hand only if genuinely broken.
#
# Sister to scripts/publish-all.mjs Step 4 (LATEST-LAG gate in v2.19.63):
# - publish-all gates the AUTHOR'S machine (pre-tag)
# - post-publish-smoke gates the REGISTRY (post-tag, post-CDN-replicate)
# - windows-install-smoke gates Windows (separate workflow, same payload)
#
# Triple-gate publish defense:
#   3.11 workspace-lockstep (pre-publish, ritual)
#   3.13 latest-lag CDN propagation (pre-tag, publish-all.mjs step 4)
#   post-publish-smoke (post-tag, this file)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to smoke test (defaults to tag name)'
        required: false

jobs:
  post-publish-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve target version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Tag name like v2.19.64 → strip leading v
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "target=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target version: $VERSION"

      - name: Wait 60s for npm CDN replication
        run: sleep 60

      - name: Verify @latest dist-tag points to target (npm view)
        id: latest_view
        shell: bash
        run: |
          set -e
          ATTEMPT=0
          MAX=20
          TARGET="${{ steps.ver.outputs.target }}"
          while [ $ATTEMPT -lt $MAX ]; do
            LATEST=$(npm view mneme-ai@latest version 2>/dev/null || echo "(unknown)")
            echo "attempt $ATTEMPT: @latest = $LATEST, want $TARGET"
            if [ "$LATEST" = "$TARGET" ]; then
              echo "✓ @latest resolved to $TARGET"
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT+1))
            sleep 30
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "⚠ @latest still not resolving to $TARGET after 10min (got $LATEST)"
          # Don't fail — tag may take longer for CDN. Continue with @<exact> path.

      - name: Install mneme-ai globally from npm (retry for CDN lag)
        id: install
        shell: bash
        run: |
          set -e
          TARGET="${{ steps.ver.outputs.target }}"
          # v2.136.0 — retry install + version up to 5×: a fresh publish can lag
          # the registry CDN for a minute, which previously produced a FALSE smoke
          # failure (and, if NPM_TOKEN were set, a spurious deprecate of a GOOD
          # release). A real break still fails after the retries.
          INSTALLED="(failed)"
          # 8 attempts × 30s ≈ 4 min of CDN-replication tolerance (was 5×20s ≈ 1.7 min):
          # a fresh publish occasionally takes >2 min to replicate to the install
          # endpoint, which produced FALSE smoke failures even though @latest already
          # resolved. A genuine break still fails after the wider window.
          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            npm install -g "mneme-ai@$TARGET" --omit=optional --loglevel=error || { echo "install attempt $ATTEMPT failed, retrying…"; sleep 30; continue; }
            INSTALLED=$(mneme --version 2>&1 || echo "(failed)")
            echo "attempt $ATTEMPT — installed version: $INSTALLED"
            if echo "$INSTALLED" | grep -q "$TARGET"; then echo "✓ version matches"; break; fi
            echo "version mismatch (got '$INSTALLED', want '$TARGET') — retrying…"; sleep 30
          done
          if ! echo "$INSTALLED" | grep -q "$TARGET"; then
            echo "::error::mneme --version reported '$INSTALLED' but expected '$TARGET' after 8 attempts"
            exit 1
          fi

      - name: Smoke 1 — mneme welcome --json '{}'
        shell: bash
        run: |
          set -e
          OUT=$(mneme welcome --json '{}' 2>&1)
          echo "$OUT" | head -3
          # Must be valid JSON
          echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{JSON.parse(s)})" || {
            echo "::error::mneme welcome --json '{}' did not produce valid JSON"
            exit 1
          }

      - name: Smoke 2 — mneme verify "smoke claim"
        shell: bash
        run: |
          set -e
          # The verify CLI must run + return a verdict (any verdict) without throwing.
          # NOTE: assert on the EXIT CODE + JSON validity — NOT a grep for "FAIL"
          # (a legitimate verdict/explanation can contain the word "fail", which the
          # old `grep -q FAIL` flagged as a crash → false smoke failure).
          if ! OUT=$(mneme verify "smoke claim from post-publish CI" --json 2>&1); then
            echo "$OUT" | head -5
            echo "::error::mneme verify exited non-zero"
            exit 1
          fi
          echo "$OUT" | head -5
          echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const v=JSON.parse(s);if(!v||typeof v.verdict!=='string')process.exit(1)})" || {
            echo "::error::mneme verify did not return a JSON verdict"
            exit 1
          }

      - name: Smoke 3 — preinstall trail recorded
        shell: bash
        run: |
          set -e
          # The install we just did should have written a trail entry
          # via the inline preinstall script (v2.19.63+).
          TRAIL_PATH="$HOME/.mneme-global/preinstall-trail.jsonl"
          if [ -f "$TRAIL_PATH" ]; then
            echo "✓ trail file exists at $TRAIL_PATH"
            wc -l "$TRAIL_PATH"
            tail -3 "$TRAIL_PATH" | head -3
          else
            # Not fatal — preinstall trail is v2.19.63+, older versions won't have it
            echo "⚠ trail file missing (expected for pre-2.19.63 installs)"
          fi

      - name: Smoke failure — surface, do NOT auto-deprecate
        if: failure()
        shell: bash
        run: |
          TARGET="${{ steps.ver.outputs.target }}"
          # v2.136.0 — REMOVED the auto-`npm deprecate` on smoke failure. Reasons:
          #   (1) a CI smoke can be a FALSE positive (CDN lag, runner flake, a
          #       transient) — auto-deprecating a GOOD published release on that
          #       is self-harm that reaches every user.
          #   (2) deprecating a published version is a destructive, user-facing
          #       decision — it belongs to a human, never to a flaky job.
          # The smoke is now ADVISORY: it opens an issue so a human can review the
          # logs and decide. If a version is genuinely broken, deprecate it by hand:
          #   npm deprecate mneme-ai@<version> "<reason>"   (and `--undo` to reverse)
          echo "::warning::Post-publish smoke for mneme-ai@$TARGET failed — review the logs. NOT auto-deprecating (advisory only; deprecation is a human decision)."

      - name: Open issue on smoke failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const target = '${{ steps.ver.outputs.target }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Post-publish smoke FAILED for mneme-ai@${target}`,
              body: [
                `The post-publish smoke gate failed for **mneme-ai@${target}**.`,
                ``,
                `**Workflow run**: ${runUrl}`,
                ``,
                `## What happened`,
                `The release tag \`v${target}\` was pushed, all packages published, but the post-publish CI in a clean Ubuntu environment failed at least one smoke step (install / version / welcome / verify) — after 5 install+version retries (so it is NOT just CDN lag).`,
                ``,
                `## This is ADVISORY — nothing was auto-changed on npm`,
                `As of v2.136.0 the smoke gate does **NOT** auto-deprecate. A CI smoke can be a false positive, and deprecating a published version is a human decision. **No npm dist-tag or deprecation was changed.** Review the logs and decide.`,
                ``,
                `## Next steps`,
                `1. Investigate the smoke run logs at ${runUrl}`,
                `2. If genuinely broken, bump to the next version with a fix (the new \`@latest\` supersedes this one for all users)`,
                `3. ONLY if you confirm it's broken AND want to block installs: \`npm deprecate mneme-ai@${target} "<reason>"\` (reverse with \`--undo\`) — manual, your call`,
              ].join('\\n'),
              labels: ['bug', 'release', 'post-publish-failure'],
            });

      - name: Success summary
        if: success()
        shell: bash
        run: |
          TARGET="${{ steps.ver.outputs.target }}"
          echo "## ✅ Post-publish smoke PASSED for mneme-ai@$TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Install from npm (\`@$TARGET\`): ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`mneme --version\` exit 0: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`mneme welcome --json '{}'\`: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`mneme verify\` returns verdict: ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- @latest CDN resolved: ${{ steps.latest_view.outputs.ok }}" >> "$GITHUB_STEP_SUMMARY"
